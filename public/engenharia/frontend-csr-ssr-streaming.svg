<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" role="img">
  <title>CSR vs SSR vs streaming timeline</title>
  <rect fill="#f8fafc" width="780" height="260"/>
  <text x="390" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Rendering models</text>
  <rect x="40" y="52" width="220" height="180" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="150" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">CSR</text>
  <text x="150" y="108" text-anchor="middle" font-size="11" fill="#b91c1c">Minimal HTML</text>
  <text x="150" y="132" text-anchor="middle" font-size="11" fill="#b91c1c">JS bundle</text>
  <text x="150" y="156" text-anchor="middle" font-size="11" fill="#b91c1c">Data fetch</text>
  <text x="150" y="188" text-anchor="middle" font-size="11" fill="#b91c1c">LCP waits for full chain</text>
  <rect x="280" y="52" width="220" height="180" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="390" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">SSR</text>
  <text x="390" y="112" text-anchor="middle" font-size="11" fill="#047857">Full HTML early</text>
  <text x="390" y="136" text-anchor="middle" font-size="11" fill="#047857">Hydrate after</text>
  <text x="390" y="172" text-anchor="middle" font-size="11" fill="#047857">TTFB if server waits</text>
  <text x="390" y="190" text-anchor="middle" font-size="11" fill="#047857">for all data sources</text>
  <rect x="520" y="52" width="220" height="180" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="630" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">Streaming</text>
  <text x="630" y="112" text-anchor="middle" font-size="11" fill="#4338ca">Shell + fallbacks</text>
  <text x="630" y="136" text-anchor="middle" font-size="11" fill="#4338ca">Chunked HTML</text>
  <text x="630" y="172" text-anchor="middle" font-size="11" fill="#4338ca">Less monolith</text>
</svg>
