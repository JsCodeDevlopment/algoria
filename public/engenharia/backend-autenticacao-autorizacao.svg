<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img"><title>Autenticação e autorização</title><rect fill="#f8fafc" width="720" height="240"/><text x="360" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Duas portas no mesmo pedido</text><rect x="80" y="56" width="240" height="100" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="200" y="92" text-anchor="middle" font-weight="700" fill="#1e3a8a" font-size="14">Autenticação</text><text x="200" y="118" text-anchor="middle" font-size="11" fill="#1e40af">Quem és? · sessão / JWT</text><text x="200" y="142" text-anchor="middle" font-size="11" fill="#3b82f6">Não confiar em role do cliente</text><path d="M320 106 L400 106" stroke="#64748b" stroke-width="3"/><polygon points="400,106 388,100 388,112" fill="#64748b"/><rect x="400" y="56" width="240" height="100" rx="12" fill="#fce7f3" stroke="#be185d" stroke-width="2"/><text x="520" y="92" text-anchor="middle" font-weight="700" fill="#9d174d" font-size="14">Autorização</text><text x="520" y="118" text-anchor="middle" font-size="11" fill="#be185d">O que podes fazer?</text><text x="520" y="142" text-anchor="middle" font-size="11" fill="#db2777">Política no servidor · RBAC</text><text x="360" y="198" text-anchor="middle" font-size="12" fill="#475569">Ordem: validar identidade  carregar recurso  avaliar política (evita ID enumeration)</text></svg>
