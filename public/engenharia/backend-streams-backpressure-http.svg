<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img"><title>Streaming e backpressure</title><rect fill="#f8fafc" width="760" height="260"/><text x="380" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Produtor  chunks  consumidor (pausa quando saturado)</text><rect x="48" y="56" width="100" height="64" rx="10" fill="#fef3c7" stroke="#d97706"/><text x="98" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Fonte</text><path d="M148 88 L188 88" stroke="#64748b" stroke-width="2"/><rect x="188" y="70" width="48" height="36" rx="4" fill="#c7d2fe"/><rect x="242" y="70" width="48" height="36" rx="4" fill="#c7d2fe"/><rect x="296" y="70" width="48" height="36" rx="4" fill="#c7d2fe"/><text x="266" y="58" text-anchor="middle" font-size="10" fill="#475569">chunks</text><path d="M344 88 L384 88" stroke="#64748b" stroke-width="2"/><rect x="384" y="56" width="120" height="64" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="444" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Consumidor</text><path d="M504 88 L544 88" stroke="#64748b" stroke-width="2"/><rect x="544" y="56" width="168" height="64" rx="10" fill="#e0e7ff" stroke="#4338ca"/><text x="628" y="88" text-anchor="middle" font-size="11" font-weight="700" fill="#312e81">HTTP chunked</text><text x="628" y="108" text-anchor="middle" font-size="10" fill="#4338ca">primeiros bytes cedo</text><text x="380" y="160" text-anchor="middle" font-size="12" fill="#475569">Sem backpressure · buffers crescem ou dados perdem-se · middleware que materializa corpo mata streaming</text><rect x="120" y="180" width="520" height="64" rx="10" fill="#f1f5f9" stroke="#64748b"/><text x="380" y="206" text-anchor="middle" font-size="11" fill="#334155">NDJSON / parsers streaming para arrays enormes · upload para disco em fluxo</text><text x="380" y="228" text-anchor="middle" font-size="10" fill="#64748b">Memória escala com taxa mais que com tamanho instantâneo do maior cliente</text></svg>
