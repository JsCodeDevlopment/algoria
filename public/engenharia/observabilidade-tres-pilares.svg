<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="t">
  <title id="t">Três pilares da observabilidade sobre uma base de correlação</title>
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <rect x="40" y="160" width="640" height="72" rx="10" fill="url(#g1)" stroke="#6366f1" stroke-width="2"/>
  <text x="360" y="188" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#334155">Correlação · request id · contexto partilhado</text>
  <text x="360" y="212" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Base que liga eventos entre serviços sem expor PII em métricas de alta cardinalidade</text>
  <rect x="70" y="40" width="170" height="96" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="155" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#0f172a">Logs</text>
  <text x="155" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#475569">História</text>
  <text x="155" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#475569">Debug · causa raiz</text>
  <rect x="275" y="40" width="170" height="96" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="360" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#0f172a">Métricas</text>
  <text x="360" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#475569">Agregação</text>
  <text x="360" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#475569">SLOs · alertas</text>
  <rect x="480" y="40" width="170" height="96" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="565" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#0f172a">Traces</text>
  <text x="565" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#475569">Latência por hop</text>
  <text x="565" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#475569">Gaps entre serviços</text>
  <line x1="155" y1="136" x2="155" y2="160" stroke="#64748b" stroke-width="2"/>
  <line x1="360" y1="136" x2="360" y2="160" stroke="#64748b" stroke-width="2"/>
  <line x1="565" y1="136" x2="565" y2="160" stroke="#64748b" stroke-width="2"/>
