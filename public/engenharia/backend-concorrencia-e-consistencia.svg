<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img">
  <title>Race on shared balance</title>
  <rect fill="#f8fafc" width="760" height="260"/>
  <text x="380" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#0f172a">Two flows read before writes land</text>
  <rect x="48" y="48" width="300" height="88" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="198" y="78" text-anchor="middle" font-weight="700" fill="#991b1b" font-size="13">Request A</text>
  <text x="198" y="104" text-anchor="middle" font-size="11" fill="#b91c1c">read 100, debit 80, expect 20</text>
  <rect x="412" y="48" width="300" height="88" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="562" y="78" text-anchor="middle" font-weight="700" fill="#92400e" font-size="13">Request B</text>
  <text x="562" y="104" text-anchor="middle" font-size="11" fill="#b45309">read 100, debit 70, expect 30</text>
  <text x="380" y="168" text-anchor="middle" font-size="12" fill="#475569">Last write wins unaware — need transactions, optimistic locking,</text>
  <text x="380" y="188" text-anchor="middle" font-size="12" fill="#475569">idempotency keys, or partitioned queues</text>
  <rect x="120" y="208" width="520" height="40" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="380" y="234" text-anchor="middle" font-size="11" fill="#065f46">Scaling replicas multiplies concurrency — does not remove explicit invariants</text>
</svg>
