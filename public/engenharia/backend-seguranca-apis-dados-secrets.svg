<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img"><title>Estados dos dados e defesa</title><rect fill="#f8fafc" width="760" height="260"/><text x="380" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Dados em repouso · trânsito · uso</text><rect x="52" y="52" width="200" height="100" rx="12" fill="#e0e7ff" stroke="#4338ca"/><text x="152" y="88" text-anchor="middle" font-weight="700" fill="#312e81">Repouso</text><text x="152" y="114" text-anchor="middle" font-size="11" fill="#4338ca">BD · backups</text><text x="152" y="136" text-anchor="middle" font-size="10" fill="#6366f1">cifrar · IAM mínimo</text><rect x="280" y="52" width="200" height="100" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="380" y="88" text-anchor="middle" font-weight="700" fill="#1e3a8a">Trânsito</text><text x="380" y="114" text-anchor="middle" font-size="11" fill="#1d4ed8">TLS ponta a ponta</text><text x="380" y="136" text-anchor="middle" font-size="10" fill="#3b82f6">sem desativar verify</text><rect x="508" y="52" width="200" height="100" rx="12" fill="#fecaca" stroke="#dc2626"/><text x="608" y="88" text-anchor="middle" font-weight="700" fill="#991b1b">Em uso</text><text x="608" y="114" text-anchor="middle" font-size="11" fill="#b91c1c">logs · traces · Slack</text><text x="608" y="136" text-anchor="middle" font-size="10" fill="#ef4444">PII e secrets fogem aqui</text><text x="380" y="188" text-anchor="middle" font-size="12" fill="#475569">SQL parametrizado · schemas estritos · segredos via vault · audit em CI (`pnpm audit`)</text><rect x="140" y="208" width="480" height="40" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="380" y="234" text-anchor="middle" font-size="11" fill="#334155">Erros públicos sem stack trace · limitar tamanho do body JSON antes do parse</text></svg>
