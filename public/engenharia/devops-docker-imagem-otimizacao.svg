<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img">
  <title>Otimizacao de imagem Docker em camadas</title>
  <rect fill="#f8fafc" width="760" height="300"/>
  <text x="380" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Da imagem inchada ao artefacto enxuto</text>
  <rect x="40" y="52" width="300" height="200" rx="10" fill="#fef2f2" stroke="#dc2626"/>
  <text x="190" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Antes (anti-padrao)</text>
  <rect x="60" y="92" width="260" height="28" fill="#fecaca"/>
  <text x="190" y="111" text-anchor="middle" font-size="10" fill="#7f1d1d">base full OS + build tools</text>
  <rect x="60" y="128" width="260" height="28" fill="#fca5a5"/>
  <text x="190" y="147" text-anchor="middle" font-size="10" fill="#7f1d1d">COPY . sem dockerignore</text>
  <rect x="60" y="164" width="260" height="28" fill="#f87171"/>
  <text x="190" y="183" text-anchor="middle" font-size="10" fill="#450a0a">RUN apt sem limpar cache</text>
  <rect x="60" y="200" width="260" height="36" fill="#ef4444"/>
  <text x="190" y="223" text-anchor="middle" font-size="10" fill="#ffffff">dev deps na imagem final</text>
  <rect x="420" y="52" width="300" height="200" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="570" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Depois (multi-stage)</text>
  <rect x="440" y="92" width="260" height="36" fill="#a7f3d0"/>
  <text x="570" y="115" text-anchor="middle" font-size="10" fill="#064e3b">stage build: compila</text>
  <rect x="440" y="136" width="260" height="36" fill="#6ee7b7"/>
  <text x="570" y="159" text-anchor="middle" font-size="10" fill="#064e3b">stage runtime: so binarios + libs</text>
  <rect x="440" y="180" width="260" height="56" fill="#34d399"/>
  <text x="570" y="203" text-anchor="middle" font-size="10" fill="#022c22">USER nao-root: distroless ou alpine</text>
  <text x="570" y="223" text-anchor="middle" font-size="9" fill="#022c22">.dockerignore, layers ordenadas</text>
  <text x="380" y="288" text-anchor="middle" font-size="11" fill="#475569">Menor superficie, menos CVE, pull mais rapido</text>
</svg>
