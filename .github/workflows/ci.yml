name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: algoria_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Push DB Schema
        run: pnpm db:push --force
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/algoria_db

      - run: pnpm validate:content

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/algoria_db
          BETTER_AUTH_SECRET: some-secret-for-ci-build-only

      - run: pnpm exec playwright install chromium --with-deps

      - run: pnpm test:e2e
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/algoria_db
          BETTER_AUTH_SECRET: some-secret-for-ci-build-only
